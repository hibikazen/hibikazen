<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hibikazen — bug bounty hunter, building with AI agents">
<style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dr 1.2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.in{opacity:0;animation:fi .7s ease forwards}
@keyframes fi{to{opacity:1}}
.blink{animation:bl 2.2s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
.d4{animation-delay:.75s}.d5{animation-delay:.95s}.d6{animation-delay:1.15s}
.d7{animation-delay:1.35s}.d8{animation-delay:1.55s}
@media (prefers-reduced-motion:reduce){.ln,.up,.in,.blink{animation:none}.ln{stroke-dashoffset:0}.up,.in{opacity:1}}
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<line class="ln d1" x1="48" y1="58" x2="952" y2="58" stroke="#cccccc" stroke-width="1"/>
<g class="in d1">
<text class="mono" fill="#666666" x="48" y="44" font-size="11" letter-spacing="3.5">BUG BOUNTY — INDEX Nº 001</text>
<text class="mono" fill="#666666" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">INDONESIA</text>
</g>
<g class="up d2"><text class="mono" fill="#111111" x="46" y="176" font-size="72" letter-spacing="-2">HIBIKAZEN</text></g>
<g class="in d3"><text class="mono" fill="#666666" x="48" y="214" font-size="19">Bug bounty hunter — building with AI agents.</text></g>
<g class="in d4">
<text class="mono" fill="#999999" x="48" y="274" font-size="12.5" letter-spacing="1">focus  ▸</text>
<text class="mono" fill="#333333" x="128" y="274" font-size="12.5" letter-spacing="1">vulnerability research · AI-assisted security · open tooling</text>
</g>
<g class="in d5"><text class="mono" fill="#999999" x="48" y="300" font-size="12.5" letter-spacing="1">hunting bounties · shipping apps · proof before every report</text></g>
<line class="ln d6" x1="48" y1="342" x2="952" y2="342" stroke="#cccccc" stroke-width="1"/>
<g class="in d6">
<text class="mono" fill="#666666" x="48" y="372" font-size="11" letter-spacing="2.5">GITHUB — @hibikazen</text>
<text class="mono" fill="#666666" x="952" y="372" font-size="11" letter-spacing="2.5" text-anchor="end">EST. NOV 2026</text>
</g>
</svg>
